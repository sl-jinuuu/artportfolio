<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="formatting.css">
</head>
<body>
    <section>
        <h1>Art <a href="index.html">❚❚</a></h1>
    </section>
    <section class="firstsection">
        <div class="secondsection">
            <div class="cards">
                <div class="card">
                    <img src="arts/Sua_art.jpg" alt="Sua_art">
                </div>
                <div class="card">
                    <img src="arts/blueberry.jpg" alt="blueberry_art">
                </div>
                <div class="card">
                    <img src="arts/girl_art.jpg" alt="girl_art">
                </div>
                <div class="card">
                    <img src="arts/Sua_art2.jpg" alt="Sua_art2">
                </div>
                <div class="card">
                    <img src="arts/Sua_art3.jpg" alt="Sua_art3">
                </div>
                <div class="card">
                    <p>coming soon....</p>
                </div>
            </div>
    </section>
<!-- Scroll progress bar -->
<div id="scrollProgress"></div>

<!-- Back to top button -->
<button id="backToTop" type="button">⬆</button>

<!-- Custom cursor -->
<div id="cursorGlow"></div>
        <script>
    const arrow = document.querySelector("h1 a");

    arrow.addEventListener("click", function() {
        arrow.textContent = "♪";
    });
    const savedTheme = localStorage.getItem("theme");

if (savedTheme === "light") {
    document.body.classList.add("light");
}
window.addEventListener("scroll", function() {

    const scrollTop = window.scrollY;

    const pageHeight = document.documentElement.scrollHeight
                     - document.documentElement.clientHeight;

    const progress = (scrollTop / pageHeight) * 100;

    document.getElementById("scrollProgress").style.width =
        progress + "%";

});
const topButton = document.getElementById("backToTop");

window.addEventListener("scroll", function() {

    if (window.scrollY > 300) {
        topButton.style.display = "block";
    } 
    else {
        topButton.style.display = "none";
    }

});

topButton.addEventListener("click", function() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

});
const cursor = document.getElementById("cursorGlow");

document.addEventListener("mousemove", function(event) {

    cursor.style.left = event.clientX + "px";
    cursor.style.top = event.clientY + "px";

});
</script>
</body>
</html>
